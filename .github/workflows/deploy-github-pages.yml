# Build static assets and publish to GitHub Pages (Settings → Pages → Source: GitHub Actions).
#
# If the live site shows a blank page, check View Source: if you see src="/src/main.tsx", GitHub Pages
# is still publishing the repo root (branch deploy) instead of this workflow's dist/. Switch Source
# to "GitHub Actions" below and redeploy.
#
# Required repository configuration:
# 1) Settings → Pages → Build and deployment: Source = "GitHub Actions"
#
# By default the site is built in DEMO MODE: it plays the pre-processed episodes committed in
# public/demo/ (create them with `npm run demo:build`) and never calls an API, so no server or
# API keys are needed and nothing costs money.
#
# Only if you host the FastAPI server yourself:
# - Settings → Secrets and variables → Actions → Variables: VITE_DEMO_MODE = false
# - Secrets: VITE_TRANSCRIBE_URL = https://<your-api-host>/api/transcribe
#   (the server must allow this site's origin via CORS_EXTRA_ORIGINS)
#
# The workflow sets VITE_BASE_PATH to /${{ github.event.repository.name }}/ so asset URLs match
# https://<user>.github.io/<repo>/.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Demo mode: serve the pre-processed episodes in public/demo/ with no API and no keys.
          # Set the repository variable VITE_DEMO_MODE=false only if you host the API yourself.
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE || 'true' }}
          VITE_TRANSCRIBE_URL: ${{ secrets.VITE_TRANSCRIBE_URL }}
        run: |
          npm ci
          npm run build
          # Vite may omit dotfiles from public/; Jekyll ignores are not used for Actions Pages, but this is harmless.
          touch dist/.nojekyll

      - name: Verify dist is a production bundle (not repo-root index.html)
        run: |
          if grep -qE 'src="/src/main\.tsx"' dist/index.html; then
            echo "::error::dist/index.html still points at Vite dev entry; build output is wrong."
            exit 1
          fi
          if ! grep -qE '/assets/[^"]+\.js' dist/index.html; then
            echo "::error::dist/index.html has no hashed /assets/*.js script; not a Vite build."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
